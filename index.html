<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
    background: transparent;
  }

  .report-widget {
    width: 100%;
    height: 480px;
    overflow: hidden;
    position: relative;
    background: transparent;
    padding: 8px;
  }

  .report-track {
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: scrollReports 150s linear infinite;
    will-change: transform;
  }

  .report-widget:hover .report-track,
  .report-widget:focus-within .report-track {
    animation-play-state: paused;
  }

  .report-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .report-card {
    flex: 0 0 auto;
    position: relative;
    background: rgba(255, 255, 255, 0.50);
    border: 1px solid rgba(255, 255, 255, 0.75);
    border-left: 4px solid #0b356f;
    border-radius: 9px;
    padding: 16px 18px;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
    transition:
      background 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease,
      transform 0.25s ease;
  }

  .report-card:hover,
  .report-card:focus-within {
    background: rgba(255, 255, 255, 0.85);
    border-color: rgba(11, 53, 111, 0.45);
    box-shadow: 0 5px 16px rgba(0, 0, 0, 0.13);
    transform: translateX(3px);
  }

  .report-link {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    color: #102d50;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.55;
    overflow-wrap: anywhere;
  }

  .report-link::before {
    content: "";
    flex: 0 0 8px;
    width: 8px;
    height: 8px;
    margin-top: 7px;
    border-radius: 50%;
    background: #0b356f;
    box-shadow: 0 0 0 4px rgba(11, 53, 111, 0.09);
  }

  .report-link:hover {
    color: #075b9a;
  }

  .report-link:focus-visible {
    outline: 2px solid #0b356f;
    outline-offset: 4px;
    border-radius: 3px;
  }

  @keyframes scrollReports {
    from {
      transform: translateY(0);
    }
    to {
      transform: translateY(-50%);
    }
  }

  @media (max-width: 600px) {
    .report-widget {
      height: 420px;
      padding: 5px;
    }

    .report-card {
      padding: 13px 12px;
    }

    .report-link {
      font-size: 14px;
      gap: 10px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .report-track {
      animation: none;
    }

    .report-widget {
      overflow-y: auto;
    }
  }
</style>
</head>

const reportList = document.getElementById("reportList");
const reportClone = document.getElementById("reportListClone");

function createReportCard(report, index) {
  const [title, itemId] = report;

  const li = document.createElement("li");
  li.className = "report-card";

  const link = document.createElement("a");
  link.className = "report-link";
  link.href = portalBase + itemId + "/data";
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = title;
  link.setAttribute("aria-label", "Open report: " + title);

  li.appendChild(link);
  return li;
}
